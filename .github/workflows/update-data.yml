name: update-data

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --cwd site
      - run: bun run --cwd site fetch-data
      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- site/public/data/sp500.json site/public/data/btc.json site/public/data/fx.json site/public/data/meta.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat -- site/public/data/
          fi
      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/data/sp500.json site/public/data/btc.json site/public/data/fx.json site/public/data/meta.json
          git commit -m "chore(data): daily fetch $(date -u +%Y-%m-%d)"
          git push
